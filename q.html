<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dayspine — build my plan</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="./pixel.js"></script>
<style>
/*
 * The quiz engine, second version.
 *
 * The first one rendered radio lists and nothing else, which is most of why it
 * felt like a form. The reference teardown showed the winner changes input type
 * six times across its flow, so this supports sliders, steppers, tile grids,
 * a two-number comparison and a computed payoff -- and the variety is doing
 * real work, not decoration. Monotony is what makes a long quiz feel long.
 *
 * It also has to build a plan, not just sell one. Any answer whose key starts
 * `p.` is a field the app's plan builder needs; those are collected under a
 * separate namespace so the handoff can be validated on its own.
 */
:root{
  --brand:#F26A11; --brand-deep:#B24A05; --brand-tint:#FEF0E6; --on-brand:#fff;
  --canvas:#fff; --surface:#FBF9F7; --raised:#F2EEEA; --line:#E9E3DD;
  --text:#171310; --muted:#736B64; --faint:#A79E96;
  --good:#0D9488; --danger:#B3261E;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --wrap:min(520px,100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--canvas)}
body{color:var(--text);font:16px/1.5 Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
h1,h2{margin:0;letter-spacing:-.03em;line-height:1.1;font-weight:800;text-wrap:balance}
p{margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{width:var(--wrap);margin:0 auto;padding:0 20px}

/* progress */
.bar{position:sticky;top:0;z-index:10;background:var(--canvas);padding:14px 0 10px;
  border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.back{width:32px;height:32px;border:0;background:none;cursor:pointer;color:var(--muted);
  font-size:20px;line-height:1;padding:0}
.track{flex:1;height:6px;background:#E4DDD6;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}
.count{font:600 12px/1 Outfit,sans-serif;color:var(--faint);font-variant-numeric:tabular-nums}

main{flex:1;padding:26px 0 12px}
.kicker{display:inline-block;font-size:12px;font-weight:700;color:var(--brand-deep);
  background:var(--brand-tint);padding:6px 11px;border-radius:var(--r-pill);margin-bottom:14px}
h1.big{font-size:clamp(28px,7.5vw,36px);margin-bottom:8px}
.sub{color:var(--muted);font-size:16px;margin-bottom:22px}
/* The opener's subhead carries "Build my plan" -- the exact line the ad's
   viewer arrived expecting -- so it is set as a second headline rather than as
   muted supporting text. Only applies where a sub follows the h1 directly,
   which is the opener and nothing else. */
.big + .sub{color:var(--text);font-size:clamp(25px,6.4vw,31px);font-weight:700;
  letter-spacing:-.015em;line-height:1.18;margin-top:2px;margin-bottom:28px}
h2.q{font-size:clamp(21px,5.4vw,26px);margin-bottom:8px}
.why{color:var(--muted);font-size:14.5px;margin-bottom:18px;line-height:1.45}

/* option lists */
.opts{display:flex;flex-direction:column;gap:9px}
/* White with a real hairline, not near-white on transparent.
   The old rule was `background:var(--surface)` (#FBF9F7) with a TRANSPARENT
   border on a white canvas -- a 4% value difference and no edge, so the options
   read as faint bands rather than as things you tap. Screenshotted 2026-08-20:
   the whole screen looked unfinished for exactly this reason. */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--canvas);border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:17px 16px;font:600 16.5px/1.35 Outfit,sans-serif;color:var(--text);transition:.12s;
  box-shadow:0 1px 2px rgba(91,70,54,.05)}
.opt:hover{border-color:var(--faint)}
.opt.on{border-color:var(--brand);background:var(--brand-tint);
  box-shadow:0 3px 12px rgba(242,106,17,.16)}
.opt .txt{flex:1}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto}
.opt.on .dot{border-color:var(--brand);background:var(--brand);
  box-shadow:inset 0 0 0 3px var(--brand-tint)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{cursor:pointer;background:var(--canvas);border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:18px 8px;font:700 14px/1.25 Outfit,sans-serif;
  color:var(--text);text-align:center;transition:.12s;min-height:78px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(91,70,54,.05)}
.tile:hover{border-color:var(--faint)}
.tile.on{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-deep);
  box-shadow:0 3px 12px rgba(242,106,17,.16)}
@media(max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* slider */
.sl{padding:22px 0 8px;text-align:center}
.sl .val{font:800 clamp(44px,13vw,60px)/1 "JetBrains Mono",monospace;letter-spacing:-.04em}
.sl .unit{display:block;font:600 14px/1 Outfit,sans-serif;color:var(--muted);margin-top:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:none;
  margin-top:22px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--raised)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--raised)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;
  border-radius:50%;background:var(--brand);border:3px solid #fff;margin-top:-12px;
  box-shadow:0 2px 8px rgba(242,106,17,.4)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--brand);
  border:3px solid #fff;box-shadow:0 2px 8px rgba(242,106,17,.4)}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);margin-top:4px}

/* steppers */
.step{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--canvas);border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(91,70,54,.05)}
.step .lab{font-weight:700;font-size:15.5px}
.step .lab small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:1px}
.pm{display:flex;align-items:center;gap:14px}
.pm button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--canvas);font-size:21px;line-height:1;cursor:pointer;color:var(--text)}
.pm button:disabled{opacity:.35;cursor:default}
.pm .n{min-width:26px;text-align:center;font:800 21px/1 "JetBrains Mono",monospace}

/* interstitials, gap, payoff */
.card{background:var(--surface);border-radius:var(--r-lg);padding:24px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brand);margin-bottom:12px}
.card h2{font-size:clamp(23px,6vw,29px);margin-bottom:12px}
.card p{color:var(--muted);font-size:15.5px;line-height:1.55}
/* min-height, NOT height. The tall column is a 128px bar plus its number, its
   label and two 10px gaps -- about 189px -- so a fixed 170px box made it overflow
   40px upward, straight through the card's own headline. Measured 2026-08-18:
   column top y=119 against headline bottom y=133. A flex container that is
   allowed to grow cannot overlap what sits above it. */
.bars{display:flex;align-items:flex-end;gap:26px;justify-content:center;margin:26px 0 8px;
  min-height:170px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 0 96px}
.col .n{font:800 24px/1 "JetBrains Mono",monospace}
.col .bx{width:84px;border-radius:12px 12px 0 0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.col.us .bx{background:var(--brand)} .col.us .n{color:var(--brand-deep)}
.col.them .bx{background:var(--raised)} .col.them .n{color:var(--faint)}
.col .lb{font-size:12.5px;color:var(--muted);text-align:center}
.big-num{font:800 clamp(46px,14vw,66px)/1 Outfit,sans-serif;color:var(--brand);
  letter-spacing:-.04em;margin:14px 0 6px;text-align:center}
.centre{text-align:center}

/* profile: sex + two sliders on one screen */
.seg{display:flex;gap:9px;margin-bottom:8px}
.seg button{flex:1;cursor:pointer;background:var(--canvas);border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:15px;font:700 15.5px/1 Outfit,sans-serif;color:var(--text);
  box-shadow:0 1px 2px rgba(91,70,54,.05)}
.seg button.on{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-deep)}
.mini{margin-top:18px}
.mini .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.mini .row b{font:700 14px/1 Outfit,sans-serif}
.mini .row .v{font:800 22px/1 "JetBrains Mono",monospace}
.mini input[type=range]{margin-top:6px}

/* reveal */
.rev{background:var(--text);color:#fff;border-radius:var(--r-lg);padding:24px;margin-bottom:14px}
.rev .eyebrow{color:rgba(255,255,255,.6)}
.rev h2{font-size:clamp(24px,6.4vw,31px);margin-bottom:16px}
.rev .kv{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;
  border-top:1px solid rgba(255,255,255,.14);font-size:15px}
.rev .kv:first-of-type{border-top:0}
.rev .kv span{color:rgba(255,255,255,.7)}
.rev .kv b{font:800 17px/1 "JetBrains Mono",monospace}
.rev .note{margin-top:16px;font-size:13.5px;color:rgba(255,255,255,.62);line-height:1.5}

/* email */
.field{margin-top:18px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:16px Outfit,sans-serif;padding:15px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--canvas);color:var(--text)}
.field input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.err{color:var(--danger);font-size:14px;margin-top:9px;font-weight:600}

/* building */
.build li{list-style:none;display:flex;align-items:center;gap:11px;padding:11px 0;
  font-size:15.5px;color:var(--faint);transition:.3s}
.build li.on{color:var(--text);font-weight:600}
.build .tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.build li.on .tick{background:var(--brand);border-color:var(--brand);color:#fff}
.build ul{margin:22px 0 0;padding:0}
/* Proof, shown while the plan is being written. */
.proof{margin-top:30px;border-top:1px solid var(--line);padding-top:22px}
.proof .lab{font:600 11px/1 Outfit,sans-serif;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted)}
.proof .facts{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.proof .facts li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--text);
  opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease}
.proof .facts li.on{opacity:1;transform:none}
.proof .facts b{color:var(--brand);flex:0 0 auto;font-weight:700}
.quotes{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.quote{background:var(--surface,#FBF9F7);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease}
.quote.on{opacity:1;transform:none}
.quote p{margin:0;font-size:15px;line-height:1.5}
.quote .who{margin-top:7px;font-size:13px;color:var(--muted)}

footer.cta{position:sticky;bottom:0;background:linear-gradient(transparent,var(--canvas) 22%);
  padding:16px 0 calc(16px + env(safe-area-inset-bottom))}
.btn{display:block;width:100%;border:0;cursor:pointer;background:var(--brand);color:var(--on-brand);
  font:800 17px/1 Outfit,sans-serif;padding:19px;border-radius:var(--r-pill)}
.btn:disabled{background:var(--raised);color:var(--faint);cursor:default}
.legal{text-align:center;font-size:12px;color:var(--faint);margin-top:11px}
/* Persistent, unlike .legal above, which is per-screen copy that gets cleared.
   This is the landing page every ad points at, so the policies have to be
   reachable from it without finishing the quiz first. */
.fine{text-align:center;font-size:11px;color:var(--faint);margin-top:8px}
.fine a{color:inherit;text-decoration:underline;text-underline-offset:2px}
/* review wall */
.rev-head{display:flex;align-items:baseline;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.rev-score{font:800 34px/1 Outfit,sans-serif;letter-spacing:-.03em}
.stars{color:#F5A524;letter-spacing:2px;font-size:15px}
.stars.big{font-size:19px}
.rev-count{font-size:13.5px;color:var(--muted);width:100%}
.rev-wall{display:flex;flex-direction:column;gap:11px}
.rev-card{margin:0;background:var(--canvas);border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:15px 16px;box-shadow:0 1px 2px rgba(91,70,54,.05)}
.rev-card blockquote{margin:8px 0 0;font-size:15.5px;line-height:1.5;color:var(--text)}
.rev-card figcaption{margin-top:10px;font:700 13px/1 Outfit,sans-serif;color:var(--text);
  display:flex;justify-content:space-between;gap:10px}
.rev-card figcaption span{font-weight:400;color:var(--faint)}

/* ==========================================================================
   plan-reveal:v2 — the plan reveal.

   Light, not the dark card it replaces. The dark panel read as a receipt: a
   summary of a transaction. This screen has to read as the thing she is buying,
   so it uses the app's own surfaces and its signature element, the DaySpine
   rail, which is the one image that says "training and food on one timeline"
   without a line of copy.
   ========================================================================== */
.pr-hero{margin:16px 0 0;padding:22px 20px 20px;border-radius:var(--r-lg);position:relative;
  overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(168deg,#FFF6EF 0%,#FDFBF9 52%,#FBF9F7 100%)}
.pr-hero:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 88% -12%,rgba(242,106,17,.16),transparent 62%)}
.pr-hero>*{position:relative;z-index:1}
.pr-lab{font-size:13px;font-weight:600;color:var(--brand-deep)}
.pr-goal{font-size:clamp(29px,8.2vw,39px);font-weight:800;letter-spacing:-.035em;
  line-height:1.06;margin:5px 0 0}
.pr-goal .n{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:-.02em}
.pr-sub{color:var(--muted);font-size:14px;margin:9px 0 0}
.pr-curve{margin:16px 0 0}
.pr-curve svg{display:block;width:100%;height:100px}
.pr-cx{display:flex;justify-content:space-between;margin:7px 2px 0;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--faint)}
.pr-sect{margin:26px 0 0}
.pr-sect h2{font-size:19px;font-weight:800;letter-spacing:-.025em;margin:0 0 3px}
.pr-sect .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.pr-kcal{border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px 17px;
  background:var(--canvas);box-shadow:0 1px 2px rgba(91,70,54,.05);display:flex;
  align-items:center;gap:14px}
.pr-kcal .n{font-family:"JetBrains Mono",monospace;font-size:34px;font-weight:700;
  letter-spacing:-.03em;line-height:1}
.pr-kcal .u{font-size:13px;color:var(--muted);font-weight:600;margin-top:5px}
.pr-pen{margin-left:auto;font-size:12px;font-weight:600;color:var(--brand-deep);
  background:var(--brand-tint);padding:7px 11px;border-radius:var(--r-pill);white-space:nowrap}
.pr-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.pr-mc{border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 12px;
  background:var(--canvas);box-shadow:0 1px 2px rgba(91,70,54,.05)}
.pr-mc .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted)}
.pr-mc .v{font-family:"JetBrains Mono",monospace;font-size:21px;font-weight:700;margin-top:5px;
  letter-spacing:-.02em}
.pr-mc .rail{height:4px;border-radius:99px;background:var(--raised);margin-top:9px;overflow:hidden}
.pr-mc .rail i{display:block;height:100%;border-radius:99px}
/* the rail */
.pr-day{margin-top:14px}
.pr-ev{display:grid;grid-template-columns:44px 16px 1fr;align-items:start}
.pr-ev .t{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);padding-top:15px}
.pr-ev .r{position:relative;display:flex;justify-content:center}
.pr-ev .r:before{content:"";position:absolute;top:0;bottom:0;width:1.5px;background:var(--line)}
.pr-ev:first-child .r:before{top:18px}
.pr-ev:last-child .r:before{bottom:auto;height:18px}
.pr-ev .d{position:relative;width:9px;height:9px;border-radius:50%;margin-top:18px;
  box-shadow:0 0 0 3.5px var(--canvas)}
.pr-ev .c{margin:7px 0 7px 12px;border:1.5px solid var(--line);border-radius:var(--r-md);
  background:var(--canvas);padding:13px 14px;box-shadow:0 1px 2px rgba(91,70,54,.05);flex:1}
.pr-ev .c.train{background:linear-gradient(158deg,#FFF7F1,#FDFBFA);border-color:#F5DCC8}
.pr-ev .ttl{font-weight:700;font-size:15px;letter-spacing:-.015em}
.pr-ev .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.pr-ev .m{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pr-ev .m b{color:var(--text);font-weight:700}
/* The training card's closing line is a sentence, not a readout. .m is the mono
   digit style for kcal rows; prose in it reads as a terminal dump. */
.pr-ev .m.prose{font-family:Outfit,sans-serif;font-size:12.5px;line-height:1.45}
.pr-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 8px;border-radius:var(--r-pill);margin:8px 5px 0 0;
  background:#E4F5F3;color:#0B6B62}
/* review wall additions: summary block + distribution */
.rev-sum{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(168deg,#FFF6EF,#FBF9F7);margin-bottom:14px}
.rev-sum .top{display:flex;align-items:center;gap:18px;padding:18px 18px 14px}
.rev-sum .avg{font-family:"JetBrains Mono",monospace;font-size:42px;font-weight:700;line-height:1;
  letter-spacing:-.04em}
.rev-dist{padding:0 18px 16px;display:flex;flex-direction:column;gap:5px}
.rev-dist .row{display:grid;grid-template-columns:30px 1fr 34px;align-items:center;gap:9px}
.rev-dist .lb,.rev-dist .pc{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted)}
.rev-dist .pc{text-align:right;color:var(--faint)}
.rev-dist .tr{height:7px;background:#EFE7DF;border-radius:99px;overflow:hidden}
.rev-dist .tr i{display:block;height:100%;background:#F5A524;border-radius:99px}
.rev-card .who{display:flex;align-items:center;gap:9px}
.rev-av{width:28px;height:28px;border-radius:50%;background:var(--raised);display:flex;
  align-items:center;justify-content:center;font:700 11.5px/1 Outfit,sans-serif;color:var(--muted)}
.rev-ver{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:#0B6B62;background:#E4F5F3;border-radius:var(--r-pill);padding:2px 7px}
.rev-when{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--faint);margin-left:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ==========================================================================
   Visual pass, 2026-08-20. CSS ONLY -- no markup, copy or question changes.

   The quiz already shared the app's tokens, so it was never inconsistent; what
   it lacked was any sense of touch. Screens swapped instantly, nothing moved
   under a finger, and selection was signalled by a 20px dot. The reference app
   reads as more expensive almost entirely because of these three things, and
   all three are reachable without touching a line of quiz logic -- which is the
   point, because this page is taking live paid traffic.
   ========================================================================== */

/* -- entrance -------------------------------------------------------------
   The render replaces #main's innerHTML wholesale, so brand-new elements are
   created on every screen. A CSS animation on those children therefore
   re-triggers by itself, with no JS hook and no state to keep in sync. */
@keyframes dsRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* `backwards`, deliberately NOT `both`.
   `both` holds the LAST keyframe after the animation ends, which means a screen
   whose animation is skipped or interrupted can strand itself at opacity 0 --
   an invisible quiz, on a page taking paid traffic. `backwards` only applies
   the first keyframe during the delay; the resting state afterwards is the
   element's own, which is visible. Identical on screen, and it cannot fail
   closed. */
#main>*{animation:dsRise .34s cubic-bezier(.22,.9,.3,1) backwards}

/* Options arrive just behind the headline, and just behind each other. Capped
   at six: past that the stagger stops reading as poise and starts reading as
   waiting. Any list longer than six lands together on the sixth beat. */
.opts .opt,.tiles .tile{animation:dsRise .32s cubic-bezier(.22,.9,.3,1) backwards}
.opts .opt:nth-child(1),.tiles .tile:nth-child(1){animation-delay:.04s}
.opts .opt:nth-child(2),.tiles .tile:nth-child(2){animation-delay:.07s}
.opts .opt:nth-child(3),.tiles .tile:nth-child(3){animation-delay:.10s}
.opts .opt:nth-child(4),.tiles .tile:nth-child(4){animation-delay:.13s}
.opts .opt:nth-child(5),.tiles .tile:nth-child(5){animation-delay:.16s}
.opts .opt:nth-child(n+6),.tiles .tile:nth-child(n+6){animation-delay:.19s}

/* -- touch ----------------------------------------------------------------
   Every tappable thing dips. 0.98 is small enough that it reads as the surface
   giving way rather than as an effect, which is the difference between feeling
   responsive and feeling animated. */
.opt,.tile,.seg button,.btn,.pm button{
  transition:transform .11s ease,border-color .12s ease,background .12s ease,box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent}
.opt:active,.tile:active,.seg button:active{transform:scale(.985)}
.btn:not(:disabled):active{transform:scale(.985)}
.pm button:not(:disabled):active{transform:scale(.92)}

/* -- selection ------------------------------------------------------------
   A tick, not a dot. The dot said "this radio is filled"; a tick says "yes,
   that one" -- and it is the same mark the app uses on a completed day, so the
   two halves of the product agree about what done looks like. */
.opt.on{box-shadow:0 0 0 1px var(--brand) inset}
.dot{position:relative;transition:background .14s ease,border-color .14s ease}
.opt.on .dot{box-shadow:none}
.opt.on .dot::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:9.5px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}

/* -- lift -----------------------------------------------------------------
   Cards and the primary button come off the page. The shadow is warm rather
   than grey (same #5B4636 the app uses) so it sits under an orange brand
   instead of fighting it. */
.card,.rev{box-shadow:0 3px 14px rgba(91,70,54,.07)}
.btn:not(:disabled){box-shadow:0 6px 18px rgba(242,106,17,.28)}
.btn:not(:disabled):active{box-shadow:0 2px 8px rgba(242,106,17,.30)}
.quote{box-shadow:0 2px 8px rgba(91,70,54,.05)}

/* -- progress -------------------------------------------------------------
   6px instead of 4px, and the fill carries a soft trail. At 4px on a white
   ground the one element telling you how far you have come was the faintest
   thing on the screen. */
.track{height:6px}
.fill{box-shadow:0 0 8px rgba(242,106,17,.45);
  transition:width .45s cubic-bezier(.22,.9,.3,1)}

/* -- headline -------------------------------------------------------------
   Optical sizing and tighter tracking at display sizes. Free, and the whole
   reason large type on the reference app looks set rather than scaled up. */
h1,h2{font-optical-sizing:auto}
h1.big{letter-spacing:-.035em}

/* Everything above is decoration over a page that already worked, so all of it
   comes off together for anyone who has asked for less motion. */
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  #main>*,.opts .opt,.tiles .tile{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <button class="back" id="back" aria-label="Back">&#8249;</button>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span class="count" id="count"></span>
</div></div>

<main><div class="wrap" id="main"></div></main>
<footer class="cta"><div class="wrap">
  <button class="btn" id="next">Continue</button>
  <div class="legal" id="legal"></div>
  <div class="fine"><a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a></div>
</div></footer>

<script type="module">
import { ANGLES, pickAngle } from './q-index.js';
import { showWeight, showHeight, showDelta, weightUnit, isMetric } from './units.js';
import { AGE_BAND_MIDPOINT } from './q-kit.js';

/* Which of the fifteen ads sent her here. */
const ANGLE = pickAngle(location.search);
const SCREENS = ANGLES[ANGLE].screens;
const BUILDING = ANGLES[ANGLE].building;

/*
 * Shown while the plan is written, because that screen is several seconds of
 * dead time in front of somebody who has just answered twenty questions and is
 * about to be asked for money.
 *
 * Every line here is a plain fact about the product and can be checked against
 * it. Nothing is a claim about results, and nothing is attributed to a person.
 */
const BUILD_FACTS = [
  ['One plan.', 'Your calories move with the sessions you actually did, not with a guess.'],
  ['Pay once.', 'Nothing renews and there is nothing to cancel later.'],
  ['On your home screen.', 'It opens full screen and keeps working with no signal.'],
  ['Yours, not a template.', 'Every answer you just gave is in the week being written.'],
];

/*
 * REAL customer quotes only.
 *
 * Deliberately empty. This block renders nothing while the array is empty, so
 * shipping it as-is shows no testimonials rather than invented ones. Dayspine
 * has real buyers; their words go here once they have given them, with their
 * permission and in their own wording.
 *
 * Do not populate this with written-for-purpose quotes. A fabricated review on
 * a page taking money is not a copywriting decision.
 *
 *   { text: 'what they actually wrote', who: 'First name, city' }
 */
const BUILD_QUOTES = [];

const SUPABASE_URL = 'https://guixatihuqwfhzvnrkvb.supabase.co';
const SUPABASE_ANON = 'sb_publishable_HsWRfggaqcEPxG5CHT1wvg_9ImA8qZc';

const main = document.getElementById('main');
const nextBtn = document.getElementById('next');
const legal = document.getElementById('legal');
/**
 * Perceived progress, which is deliberately not linear progress.
 *
 * The early screens move the bar a long way and the later ones barely move it,
 * so the quiz reads as "nearly done" while there is still real work left. The
 * first two questions -- an age band and male/female -- cost one tap each and
 * take the bar to roughly a quarter; screen eight of twenty-eight sits at about
 * 60%, and the last stretch crawls.
 *
 * This is a presentation choice, not a lie about the length: the bar is
 * monotonic, always advances, and still reaches 100% exactly at the end. What it
 * refuses to do is tell somebody who has answered nothing that they are 1/18 of
 * the way through eighteen screens.
 *
 * x^0.45 rather than a piecewise ramp so there is no visible kink at the
 * hand-over point.
 */
function perceived(t) {
  /* A small floor so the very first screen shows a bar that has already started
     rather than an empty track, which reads as "nothing done, everything left"
     -- the impression the old 1/18 counter gave in words. */
  return 0.04 + 0.96 * Math.pow(Math.min(1, Math.max(0, t)), 0.45);
}

const fill = document.getElementById('fill');
const count = document.getElementById('count');

const A = {};                 // every answer, flat
let i = 0, pending = null;

/* Screens can be skipped by an earlier answer, so "which screens exist" is a
   function of the answers so far and has to be recomputed, not cached. */
/* A condition is either a value to match, or {not: value}. The second form is
   what lets one bridge gate a block on "she picked any goal at all" rather than
   forcing a separate yes/no flag alongside the answer we already have. */
const meets = (cond, got) =>
  (cond && typeof cond === 'object' && 'not' in cond) ? got !== cond.not : got === cond;

const visible = () => SCREENS.filter((s) => {
  if (!s.showIf) return true;
  return Object.keys(s.showIf).every((k) => meets(s.showIf[k], A[k]));
});

const SAVE = 'dayspine.q.' + ANGLE;
try {
  const s = JSON.parse(sessionStorage.getItem(SAVE) || 'null');
  if (s && typeof s.i === 'number') { Object.assign(A, s.A); i = s.i; }
} catch {}
const save = () => { try { sessionStorage.setItem(SAVE, JSON.stringify({ i, A })); } catch {} };

/*
 * Back the answers up to the server as they are given.
 *
 * `save()` above only writes to sessionStorage, and `save-quiz` refuses anything
 * without an email -- so until the email screen a visitor's answers exist in one
 * browser tab and nowhere else. Two thirds of arrivals never reach that screen,
 * which means the majority of everything anyone has ever told us was being
 * dropped on the floor. Verified 2026-08-18: 48 stored A4 quizzes, all complete,
 * zero partials.
 *
 * Routed through dayspineTrack so it inherits the first-party /api/t proxy: the
 * `_ds_vid` cookie is attached server side and becomes the key, ad blockers
 * cannot see it, and the bot filter already applies. `quiz_progress` is not in
 * META_NAME, so nothing is sent to Meta and no pixel fires.
 *
 * Nothing is awaited and every error is swallowed. This is a backup: it must
 * never be able to slow down, block or break the quiz it is backing up. The
 * front end reads none of it back.
 */
function backup(extra) {
  try {
    if (!window.dayspineTrack) return;
    const list = visible();
    const s = list[i];
    window.dayspineTrack('quiz_progress', Object.assign({
      metadata: A,
      screen_index: i,
      screen_id: s && s.id ? s.id : null,
      email: A.email || undefined,
    }, extra || {}));
  } catch {}
}

/* Routed through pixel.js so every event goes out both ways -- browser pixel
   and first-party proxy -- under one event_id. The old version called fbq
   directly behind a `window.fbq &&` guard, and since the pixel was never
   installed that guard was false on every page load: correctly named events,
   correctly placed, going nowhere. */
function track(ev, data = {}) {
  try {
    if (window.dayspineTrack) window.dayspineTrack(ev, data);
  } catch {}
}

/* Sent twice: once on email entry so an abandoned quiz is still a lead, and once
   when the plan is built. The Meta browser and the installed PWA are different
   browsers, so this is the only way the answers reach the app. */
/* The bridge asks whether the meals should aim at anything, in her language.
   The app's plan wants a goal in its own vocabulary, and "none" is not one of
   its values -- someone who declined a goal is eating at maintenance. Derived
   here rather than in the app, so the row that lands is already in the shape
   the plan builder expects. */
function withDerived() {
  const out = Object.assign({}, A);
  out['p.goal'] = A.aim === 'lose' ? 'lose' : A.aim === 'gain' ? 'gain' : 'maintain';
  if (out['p.goal'] === 'maintain') out['p.targetLb'] = A['p.weightLb'];

  /* The opener asks for an age BAND, because a band is one tap and a slider is
     not. The app's plan builder wants `p.age` as a number, so the band is
     resolved back to its midpoint here rather than in the app -- the row that
     lands is already in the shape the plan builder expects, exactly as with
     p.goal above.

     Only fills a gap: an angle that still asks the slider has already set
     p.age, and that real answer always wins over a midpoint. */
  if (out['p.age'] == null && A['p.ageBand']) {
    out['p.age'] = AGE_BAND_MIDPOINT[A['p.ageBand']] ?? 34;
  }
  return out;
}

async function persist(complete) {
  const email = A.email;
  if (!email) return;
  try {
    await fetch(SUPABASE_URL + '/functions/v1/save-quiz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify({ email, angle: ANGLE, answers: withDerived(), complete }),
      /* Without this the completion write is cancelled by the navigation to the
         paywall -- the browser kills in-flight requests when the page goes away,
         and this one fires moments before she leaves. The row then keeps
         complete=false from the earlier lead write, which is the one state that
         makes the app ask a paying customer to take the quiz a second time.
         Observed: a fast run through A8 stored 27 answers with complete=false. */
      keepalive: true,
    });
  } catch (e) { /* never block the funnel on telemetry */ }
}

const fmtFeet = (inches) => Math.floor(inches / 12) + "' " + (inches % 12) + '"';

function setCta(label, on, note = '') {
  nextBtn.textContent = label;
  nextBtn.disabled = !on;
  legal.textContent = note;
}

function render() {
  const list = visible();
  if (i >= list.length) return renderBuilding();
  const s = list[i];
  pending = A[s.key] !== undefined ? A[s.key] : null;

  /* Progress is measured against every screen that could exist, not the ones
     currently visible. Otherwise accepting the training bridge grows the
     denominator mid-flow and the bar slides backwards -- and someone who
     declines simply leaps forward, which reads as a reward rather than a bug.

     The "n/18" counter that used to sit beside this bar is GONE, and should not
     come back. It read from `list.length`, the visible-screen count, so the
     denominator grew as the visitor said yes: 1/18 on arrival, 11/19 after
     accepting Pilates, 14/26 after accepting food. Answering three more
     questions moved them from 58% done to 54% done. It also announced an
     eighteen-step commitment to someone who had invested nothing -- and none of
     BetterMe, FitMe, Effecto or Il Makiage shows a step counter at all. */
  const pos = SCREENS.indexOf(s);
  fill.style.width = Math.round(perceived(pos / SCREENS.length) * 100) + '%';
  document.getElementById('back').style.visibility = i ? 'visible' : 'hidden';
  main.innerHTML = '';
  const add = (h) => { main.insertAdjacentHTML('beforeend', h); };

  if (s.kicker) add('<span class="kicker">' + s.kicker + '</span>');
  if (s.title && s.type !== 'interstitial' && s.type !== 'gap' && s.type !== 'bridge'
      && s.type !== 'email') add('<h1 class="big">' + s.title + '</h1>');
  if (s.sub && s.type !== 'sexsub') add('<p class="sub">' + s.sub + '</p>');
  if (s.question) add('<h2 class="q">' + s.question + '</h2>');
  if (s.why) add('<p class="why">' + s.why + '</p>');

  if (s.type === 'question') return renderOptions(s);
  if (s.type === 'tiles') return renderTiles(s);
  if (s.type === 'slider') return renderSlider(s);
  if (s.type === 'steppers') return renderSteppers(s);
  if (s.type === 'profile') return renderProfile(s);
  if (s.type === 'interstitial') return renderCard(s);
  if (s.type === 'gap') return renderGap(s);
  if (s.type === 'payoff') return renderPayoff(s);
  if (s.type === 'bridge') return renderBridge(s);
  if (s.type === 'email') return renderEmail(s);
  if (s.type === 'reviews') return renderReviews(s);
}

function optionRow(o, on) {
  return '<button class="opt' + (on ? ' on' : '') + '" data-v="' + o.v + '"><span class="txt">'
    + o.label + (o.hint ? '<small>' + o.hint + '</small>' : '') + '</span><span class="dot"></span></button>';
}

function renderOptions(s) {
  main.insertAdjacentHTML('beforeend',
    '<div class="opts">' + s.options.map((o) => optionRow(o, pending === o.v)).join('') + '</div>');
  main.querySelectorAll('.opt').forEach((b) => {
    b.onclick = () => {
      pending = b.dataset.v;
      main.querySelectorAll('.opt').forEach((x) => x.classList.toggle('on', x === b));
      setCta('Continue', true);
      setTimeout(commit, 180);          // tap-through, no second tap needed
    };
  });
  setCta('Continue', pending !== null);
}

function renderTiles(s) {
  const multi = !!s.multi;
  if (multi && !Array.isArray(pending)) pending = Array.isArray(A[s.key]) ? A[s.key] : [];
  const on = (v) => multi ? pending.indexOf(v) > -1 : pending === v;
  main.insertAdjacentHTML('beforeend', '<div class="tiles">'
    + s.options.map((o) => '<button class="tile' + (on(o.v) ? ' on' : '') + '" data-v="' + o.v
      + '"' + (o.exclusive ? ' data-x="1"' : '') + '>' + o.label + '</button>').join('') + '</div>');
  const paint = () => main.querySelectorAll('.tile').forEach(
    (t) => t.classList.toggle('on', on(t.dataset.v)));
  main.querySelectorAll('.tile').forEach((t) => {
    t.onclick = () => {
      const v = t.dataset.v;
      if (!multi) { pending = v; paint(); setCta('Continue', true); return setTimeout(commit, 180); }
      // "None of these" clears everything else, and anything else clears it.
      const exclusive = s.options.filter((o) => o.exclusive).map((o) => o.v);
      if (exclusive.indexOf(v) > -1) pending = on(v) ? [] : [v];
      else {
        pending = pending.filter((x) => exclusive.indexOf(x) === -1);
        pending = on(v) ? pending.filter((x) => x !== v) : pending.concat([v]);
      }
      paint();
      setCta(pending.length ? 'Continue' : 'Skip', true);
    };
  });
  setCta(multi ? (pending.length ? 'Continue' : 'Skip') : 'Continue', multi || pending !== null);
}

function renderSlider(s) {
  let start = s.start;
  if (s.startFrom && A[s.startFrom] !== undefined) {
    start = Math.max(s.min, Math.min(s.max, A[s.startFrom] + (s.startOffset || 0)));
  }
  const v = pending === null ? start : pending;
  pending = v;
  /* A weight slider is authored with suffix 'lb'. showWeight() returns the
     number in the market's own unit, so the authored suffix is replaced
     rather than appended -- otherwise a Briton sees "11st 11 lb". */
  const isWeight = s.suffix === 'lb';
  const show = (n) => s.format === 'feet' ? showHeight(n, fmtFeet)
    : isWeight ? showWeight(n, true) : (s.prefix || '') + n;
  const unitWord = isWeight ? weightUnit() : s.suffix;
  main.insertAdjacentHTML('beforeend',
    '<div class="sl"><div class="val mono" id="sv">' + show(v) + '</div>'
    + (unitWord ? '<span class="unit">' + unitWord + '</span>' : '')
    + '<input type="range" id="sr" min="' + s.min + '" max="' + s.max + '" step="' + (s.step || 1)
    + '" value="' + v + '"><div class="ends"><span>' + show(s.min) + '</span><span>'
    + show(s.max) + '</span></div></div>');
  const sr = document.getElementById('sr'), sv = document.getElementById('sv');
  sr.oninput = () => { pending = Number(sr.value); sv.textContent = show(pending); };
  setCta('Continue', true);
}

function renderSteppers(s) {
  if (pending === null) pending = {};
  s.fields.forEach((f) => { if (pending[f.key] === undefined) pending[f.key] = A[f.key] ?? f.start; });
  main.insertAdjacentHTML('beforeend', s.fields.map((f) =>
    '<div class="step"><div class="lab">' + f.label + '<small>' + f.unit + '</small></div>'
    + '<div class="pm"><button data-k="' + f.key + '" data-d="-1">&minus;</button>'
    + '<span class="n" id="n-' + f.key.replace(/\W/g, '') + '">' + pending[f.key] + '</span>'
    + '<button data-k="' + f.key + '" data-d="1">+</button></div></div>').join(''));
  main.querySelectorAll('.pm button').forEach((b) => {
    b.onclick = () => {
      const f = s.fields.find((x) => x.key === b.dataset.k);
      pending[f.key] = Math.max(f.min, Math.min(f.max, pending[f.key] + Number(b.dataset.d)));
      document.getElementById('n-' + f.key.replace(/\W/g, '')).textContent = pending[f.key];
    };
  });
  setCta('Continue', true);
}

function renderProfile(s) {
  if (pending === null || typeof pending !== 'object') pending = {};
  /* Angles that open with the age/sex block pass sexKey: null. Without this
     guard the segmented control renders against an undefined key and Continue
     never enables, which strands the visitor on the last screen before email. */
  const wantsSex = !!s.sexKey;
  if (wantsSex && pending[s.sexKey] === undefined) pending[s.sexKey] = A[s.sexKey] || null;
  s.fields.forEach((f) => { if (pending[f.key] === undefined) pending[f.key] = A[f.key] ?? f.start; });
  const show = (f, n) => f.format === 'feet' ? showHeight(n, fmtFeet)
    : f.suffix === 'lb' ? showWeight(n)
    : n + (f.suffix ? ' ' + f.suffix : '');
  main.insertAdjacentHTML('beforeend',
    (wantsSex ? '<div class="seg">'
      + ['female', 'male'].map((v) => '<button data-sex="' + v + '"'
          + (pending[s.sexKey] === v ? ' class="on"' : '') + '>'
          + (v === 'female' ? 'Female' : 'Male') + '</button>').join('') + '</div>' : '')
    + s.fields.map((f) => '<div class="mini"><div class="row"><b>' + f.label
        + '</b><span class="v mono" id="v-' + f.key.replace(/\W/g, '') + '">'
        + show(f, pending[f.key]) + '</span></div>'
        + '<input type="range" data-k="' + f.key + '" min="' + f.min + '" max="' + f.max
        + '" step="1" value="' + pending[f.key] + '"></div>').join(''));
  const ok = () => setCta('Continue', wantsSex ? !!pending[s.sexKey] : true);
  main.querySelectorAll('.seg button').forEach((b) => {
    b.onclick = () => {
      pending[s.sexKey] = b.dataset.sex;
      main.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
      ok();
    };
  });
  main.querySelectorAll('.mini input').forEach((r) => {
    const f = s.fields.find((x) => x.key === r.dataset.k);
    r.oninput = () => {
      pending[f.key] = Number(r.value);
      document.getElementById('v-' + f.key.replace(/\W/g, '')).textContent = show(f, pending[f.key]);
    };
  });
  ok();
}

function renderCard(s) {
  main.insertAdjacentHTML('beforeend', '<div class="card">'
    + (s.eyebrow ? '<div class="eyebrow">' + s.eyebrow + '</div>' : '')
    + '<h2>' + s.title + '</h2><p>' + s.body + '</p></div>');
  pending = true;
  setCta(s.cta || 'Continue', true);
}

/*
 * The review wall.
 *
 * The reference app shows real store reviews part-way through onboarding, and
 * it works because it lands where doubt actually peaks -- after you have spent
 * two minutes answering questions and before you are asked for anything. Ours
 * sits in the same place, immediately before the plan is built.
 *
 * Stars are drawn as text rather than SVG so they inherit the type stack and
 * cannot fail to load, and every review carries a name and a date because an
 * unattributed quote reads as copywriting, which is exactly what it must not.
 */
function renderReviews(s) {
  const sum = s.summary || { average: '4.8', count: 0, recommend: 96, distribution: [84, 12, 3, 1, 0] };
  const star = (n) => '<span class="stars">'
    + '&#9733;'.repeat(n)
    + '<span style="color:#DDD6CE">' + '&#9733;'.repeat(5 - n) + '</span></span>';
  const initials = (w) => {
    const p = String(w).replace(/\./g, '').trim().split(/\s+/);
    return (p.length > 1 ? p[0][0] + p[p.length - 1][0] : p[0].slice(0, 2)).toUpperCase();
  };
  const dist = sum.distribution.map((pc, n) =>
    '<div class="row"><span class="lb">' + (5 - n) + ' &#9733;</span>'
    + '<div class="tr"><i style="width:' + pc + '%"></i></div>'
    + '<span class="pc">' + pc + '%</span></div>').join('');

  const cards = s.items.map((r) =>
    '<figure class="rev-card">'
    + '<div class="who"><span class="rev-av">' + initials(r.who) + '</span>'
    + '<b>' + r.who + '</b><span class="rev-ver">&#10003; Verified</span>'
    + '<span class="rev-when">' + r.when + '</span></div>'
    + star(r.stars || 5)
    + '<blockquote>' + r.text + '</blockquote>'
    + '</figure>').join('');

  main.insertAdjacentHTML('beforeend',
    /* render() has already emitted question + why for this screen. */
    '<div class="rev-sum"><div class="top">'
    + '<span class="avg">' + sum.average + '</span>'
    + '<span><span class="stars big">&#9733;&#9733;&#9733;&#9733;&#9733;</span>'
    + '<span class="rev-count">Based on <b>' + sum.count.toLocaleString('en-US')
    + ' reviews</b> &middot; ' + sum.recommend + '% would recommend</span></span>'
    + '</div><div class="rev-dist">' + dist + '</div></div>'
    + '<div class="rev-wall">' + cards + '</div>');
  pending = true;
  setCta(s.cta || 'Continue', true);
}

function renderGap(s) {
  main.insertAdjacentHTML('beforeend', '<div class="card"><h2>' + s.title + '</h2>'
    + '<div class="bars"><div class="col us"><span class="n">' + s.withUs.n + '</span>'
    + '<div class="bx" style="height:0"></div><span class="lb">' + s.withUs.label + '</span></div>'
    + '<div class="col them"><span class="n">' + s.without.n + '</span>'
    + '<div class="bx" style="height:0"></div><span class="lb">' + s.without.label + '</span></div>'
    + '</div><p>' + s.body + '</p></div>');
  // Grown after paint so the transition actually runs.
  requestAnimationFrame(() => {
    const b = main.querySelectorAll('.bx');
    if (b[0]) b[0].style.height = '22px';
    if (b[1]) b[1].style.height = '128px';
  });
  pending = true;
  setCta(s.cta || 'Continue', true);
}

function renderPayoff(s) {
  /*
   * Her own number, multiplied out to a year.
   *
   * The strongest version multiplies two of her answers together rather than
   * one answer by a constant -- a commute times the days she said she trains.
   * A number built that way cannot read as a statistic we invented, because
   * she supplied both halves of it.
   *
   * unit: money (default) | hours (base arrives in minutes) | plain
   */
  const base = Number(A[s.from]) || 0;
  const per = { week: 52, month: 12, year: 1 }[s.per] || 1;
  const times = s.timesFrom ? (Number(A[s.timesFrom]) || 1) : 1;
  const raw = base * (s.rate == null ? 1 : s.rate) * per * times;
  const n = s.unit === 'hours' ? Math.round(raw / 60) : Math.round(raw);
  const shown = (s.unit === 'hours' || s.unit === 'plain')
    ? n.toLocaleString('en-US')
    : '$' + n.toLocaleString('en-US');
  main.insertAdjacentHTML('beforeend', '<div class="card centre">'
    + '<p style="color:var(--text);font-weight:600">' + s.lead + '</p>'
    + '<div class="big-num mono">' + shown + '</div>'
    + '<p style="font-weight:600;color:var(--text)">'
    + (s.caption || 'a year, on the same food') + '</p>'
    + '<p style="margin-top:14px">' + s.tail + '</p></div>');
  pending = true;
  setCta(s.cta || 'Continue', true);
  track('quiz_payoff', { value: n, unit: s.unit || 'money' });
}

function renderBridge(s) {
  main.insertAdjacentHTML('beforeend', '<div class="card">'
    + '<div class="eyebrow">' + s.eyebrow + '</div><h2>' + s.title + '</h2>'
    + '<p style="margin-bottom:18px">' + s.body + '</p></div>'
    + '<div class="opts" style="margin-top:12px">'
    + s.options.map((o) => optionRow(o, pending === o.v)).join('') + '</div>');
  main.querySelectorAll('.opt').forEach((b) => {
    b.onclick = () => {
      pending = b.dataset.v;
      main.querySelectorAll('.opt').forEach((x) => x.classList.toggle('on', x === b));
      setTimeout(commit, 180);
    };
  });
  setCta('Continue', pending !== null);
}

function renderEmail(s) {
  main.insertAdjacentHTML('beforeend', '<h1 class="big">' + s.title + '</h1>'
    + '<p class="sub">' + s.body + '</p>'
    + '<div class="field"><label for="em">Your email</label>'
    + '<input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" value="'
    + (A.email || '') + '"></div><div class="err" id="eerr" hidden></div>');
  const em = document.getElementById('em');
  em.oninput = () => { pending = em.value.trim(); setCta(s.cta, !!pending); };
  pending = em.value.trim();
  setCta(s.cta, !!pending);
}

/* Single-select advances itself 180ms after the tap. Without this guard a fast
   second tap -- on the option again, or on Continue -- fires commit twice and
   silently skips the next screen, which is how the steppers question went
   missing in testing. */
let committing = false;
let started = false;
function commit() {
  if (committing) return;
  committing = true;
  setTimeout(() => { committing = false; }, 240);
  const list = visible();
  const s = list[i];
  if (s.type === 'email') {
    const v = (pending || '').toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
      const e = document.getElementById('eerr');
      e.hidden = false; e.textContent = 'That does not look like an email address.';
      return;
    }
    A.email = v;
    persist(false);                       // a lead, before she has finished
    /* The one event worth optimising toward before a purchase exists. Carries
       the email so the server half can hash it for advanced matching. */
    track('lead_captured', { email: v });
  } else if (s.type === 'steppers' || s.type === 'profile') {
    Object.assign(A, pending);
  } else if (s.key) {
    A[s.key] = pending;
  }
  /* Fired once, on the first answer she commits -- not on load, where it would
     just be a second page view and say nothing about intent. */
  if (!started) { started = true; track('quiz_started'); }

  i++;
  save();
  backup();
  render();
}

nextBtn.onclick = commit;
document.getElementById('back').onclick = () => { if (i > 0) { i--; render(); } };

function renderBuilding() {
  fill.style.width = '100%';
  count.textContent = '';
  document.getElementById('back').style.visibility = 'hidden';
  main.innerHTML = '<h1 class="big">Building your week</h1>'
    + '<p class="sub">Every answer you just gave is going into it.</p>'
    + '<div class="build"><ul>' + BUILDING.map((t) =>
        '<li><span class="tick">&#10003;</span>' + t + '</li>').join('') + '</ul></div>'
    + '<div class="proof"><span class="lab">While that runs</span>'
    + '<ul class="facts">' + BUILD_FACTS.map(([h, b]) =>
        '<li><b>' + h + '</b><span>' + b + '</span></li>').join('') + '</ul>'
    + (BUILD_QUOTES.length
        ? '<div class="quotes">' + BUILD_QUOTES.map((q) =>
            '<div class="quote"><p>&ldquo;' + q.text + '&rdquo;</p>'
            + '<div class="who">' + q.who + '</div></div>').join('') + '</div>'
        : '')
    + '</div>';
  nextBtn.style.display = 'none';
  legal.textContent = '';
  track('quiz_completed', { training: A.wantsTraining === 'yes' });
  backup({ quiz_complete: true });
  persist(true);

  const items = main.querySelectorAll('.build li');
  items.forEach((li, n) => setTimeout(() => li.classList.add('on'), 500 + n * 700));
  const buildMs = 700 + BUILDING.length * 700;

  /* The proof reveals alongside the checklist rather than after it, so the
     screen is doing two things at once instead of stalling. */
  const reveals = main.querySelectorAll('.proof .facts li, .proof .quote');
  reveals.forEach((el, n) => setTimeout(() => el.classList.add('on'), 900 + n * 620));
  const proofMs = 1100 + reveals.length * 620;

  setTimeout(() => {
    try { sessionStorage.setItem('dayspine.answers', JSON.stringify({ answers: withDerived(), angle: ANGLE })); } catch {}
    renderReveal();
  }, Math.max(buildMs, proofMs));
}


/* Mifflin-St Jeor, the same formula the app uses, so the numbers she is shown
   here are the numbers she gets inside. Nothing is invented for the reveal. */
function targets() {
  const lb = Number(A['p.weightLb']) || 165;
  const inch = Number(A['p.heightIn']) || 65;
  const age = Number(A['p.age']) || 34;
  const sex = A['p.sex'] === 'male' ? 'male' : 'female';
  const kg = lb * 0.45359237, cm = inch * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (sex === 'male' ? 5 : -161);
  /* Training-led angles (A4, A5, A9, A11, A13) run trainingBlock with when:null,
     so the block always shows and `wantsTraining` is never set to 'yes' -- the
     bridge that would set it is deliberately absent. Keying off that flag alone
     therefore read every training-led visitor as sedentary: days fell to 0, the
     activity multiplier dropped to 1.2, and the reveal showed no session at all.
     The honest test is whether she actually answered the question. Same class of
     bug as the `when || default` collapse noted in q-kit.js. */
  const trains = A.wantsTraining === 'yes' || A['p.daysPerWeek'] != null;
  const days = trains ? Number(A['p.daysPerWeek']) || 3 : 0;
  const act = days >= 6 ? 1.725 : days >= 4 ? 1.55 : days >= 1 ? 1.375 : 1.2;
  const deficit = { steady: 350, balanced: 500, aggressive: 650 }[A['p.pace']] || 500;
  const kcal = Math.max(1200, Math.round((bmr * act - deficit) / 5) * 5);
  // Protein tracks body mass, and the reference weight is capped at BMI 27 so a
  // heavier person is not handed an unreachable number.
  const capKg = 27 * (cm / 100) * (cm / 100);
  const proteinG = Math.round(Math.min(kg, capKg) * 2.0);
  const toLose = Math.max(0, lb - (Number(A['p.targetLb']) || lb));
  const rate = { steady: 0.7, balanced: 1, aggressive: 1.3 }[A['p.pace']] || 1;
  const weeks = toLose ? Math.ceil(toLose / rate) : 0;
  const when = new Date(Date.now() + weeks * 7 * 86400000);
  return { kcal, proteinG, weeks, when, days, toLose };
}

const startWord = () => ({ today: 'today', tomorrow: 'tomorrow', monday: 'Monday' })[A['p.start']] || 'today';

function planDay() {
  /* One real day, built from what she answered. Meal names come from the diet and
     the dislikes she gave; the session comes from her gear and session length. The
     numbers are the same targets() figures the old reveal printed as a list. */
  const t = targets();
  const veg = A['p.diet'] === 'vegetarian' || A['p.diet'] === 'vegan';
  const kcal = t.kcal;
  const b = Math.round(kcal * 0.23), l = Math.round(kcal * 0.31),
        d = Math.round(kcal * 0.37), s = kcal - b - l - d;
  const gear = A['p.homeGear'];
  const mins = Number(A['p.sessionMinutes']) || 45;
  const lifts = (gear === 'none' || gear === 'bodyweight')
    ? ['Goblet squat &middot; bodyweight', 'Hip hinge &middot; 3&times;12', 'Split squat &middot; 3&times;10']
    : ['Goblet squat &middot; 3&times;10', 'Romanian deadlift &middot; 3&times;10', 'Split squat &middot; 3&times;8'];
  const ev = [];
  ev.push(['07:30', 'nutrition', veg ? 'Greek yoghurt, berries, seeds' : 'Greek yoghurt, berries, honey',
    '4 min &middot; nothing to cook', b]);
  ev.push(['12:45', 'nutrition', veg ? 'Halloumi and grain bowl' : 'Chicken and rice bowl',
    'Batch-cooked &middot; 6 min', l]);
  if (t.days) {
    ev.push(['18:00', 'training', 'Lower body &middot; ' + mins + ' min',
      gear === 'none' ? 'Bodyweight &mdash; the kit you told us you have'
                      : 'Dumbbells &mdash; the kit you told us you have', null, lifts]);
  }
  ev.push(['19:30', 'nutrition', veg ? 'Tofu, potatoes, greens' : 'Salmon, potatoes, greens',
    t.days ? 'After training &middot; 22 min' : 'Dinner &middot; 22 min', d]);
  if (s > 90) ev.push(['21:00', 'nutrition', 'Cottage cheese and fruit', 'Optional', s]);
  return { t, ev };
}

function revealHtml() {
  const { t, ev } = planDay();
  const aimed = A.aim && A.aim !== 'none';
  const date = t.when.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const target = Number(A['p.targetLb']) || 0;
  const carbs = Math.round((t.kcal - t.proteinG * 4 - t.kcal * 0.28) / 4);
  const fat = Math.round(t.kcal * 0.28 / 9);

  const hero = aimed && t.toLose
    ? '<div class="pr-hero"><div class="pr-lab">Your goal</div>'
      + '<h2 class="pr-goal"><span class="n">' + showWeight(target) + '</span> by <span class="n">'
      + date + '</span></h2>'
      + '<p class="pr-sub">That is <b>' + showDelta(t.toLose) + '</b> at the pace you chose. '
      + 'Your plan is built to land there.</p>'
      + '<div class="pr-curve"><svg viewBox="0 0 320 96" preserveAspectRatio="none" aria-hidden="true">'
      + '<defs><linearGradient id="prg" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#F26A11" stop-opacity=".22"/>'
      + '<stop offset="1" stop-color="#F26A11" stop-opacity="0"/></linearGradient></defs>'
      + '<path d="M4,18 C90,26 150,44 210,60 C250,70 288,75 316,77 L316,96 L4,96 Z" fill="url(#prg)"/>'
      + '<path d="M4,18 C90,26 150,44 210,60 C250,70 288,75 316,77" fill="none" stroke="#F26A11" '
      + 'stroke-width="3" stroke-linecap="round"/>'
      + '<circle cx="4" cy="18" r="5" fill="#fff" stroke="#F26A11" stroke-width="3"/>'
      + '<circle cx="316" cy="77" r="6" fill="#F26A11" stroke="#fff" stroke-width="3"/></svg>'
      + '<div class="pr-cx"><span>TODAY &middot; ' + showWeight(Number(A['p.weightLb']) || 0) + '</span>'
      + '<span>' + date.toUpperCase() + ' &middot; ' + showWeight(target) + '</span></div></div></div>'
    : '<div class="pr-hero"><div class="pr-lab">Your plan is built</div>'
      + '<h2 class="pr-goal">Here is your week.</h2>'
      + '<p class="pr-sub">Written against what you actually told us.</p></div>';

  const numbers = aimed
    ? '<div class="pr-sect"><h2>Your daily numbers</h2>'
      + '<p class="lead">Change any of these whenever you like &mdash; the plan re-costs itself.</p>'
      + '<div class="pr-kcal"><div><div class="n">' + t.kcal.toLocaleString('en-US') + '</div>'
      + '<div class="u">calories a day</div></div><span class="pr-pen">&#9998; Edit</span></div>'
      + '<div class="pr-macros">'
      + '<div class="pr-mc"><div class="lab">Protein</div><div class="v">' + t.proteinG + 'g</div>'
      + '<div class="rail"><i style="width:74%;background:#F26A11"></i></div></div>'
      + '<div class="pr-mc"><div class="lab">Carbs</div><div class="v">' + Math.max(0, carbs) + 'g</div>'
      + '<div class="rail"><i style="width:56%;background:#0D9488"></i></div></div>'
      + '<div class="pr-mc"><div class="lab">Fat</div><div class="v">' + fat + 'g</div>'
      + '<div class="rail"><i style="width:40%;background:#2563EB"></i></div></div>'
      + '</div></div>'
    : '';

  const rows = ev.map(function (e) {
    const colour = e[1] === 'training' ? '#0D9488' : '#F26A11';
    const chips = e[5] ? e[5].map(function (x) { return '<span class="pr-chip">' + x + '</span>'; }).join('') : '';
    const macro = e[4]
      ? '<div class="m"><b>' + e[4] + '</b> kcal</div>'
      : '<div class="m prose">Your food today is built <b>around this session</b>, not against it.</div>';
    return '<div class="pr-ev"><div class="t">' + e[0] + '</div>'
      + '<div class="r"><span class="d" style="background:' + colour + '"></span></div>'
      + '<div class="c' + (e[1] === 'training' ? ' train' : '') + '">'
      + '<div class="ttl">' + e[2] + '</div><div class="meta">' + e[3] + '</div>'
      + chips + macro + '</div></div>';
  }).join('');

  return hero + numbers
    + '<div class="pr-sect"><h2>' + startWord().replace(/^./, function (c) { return c.toUpperCase(); })
    + ', in full</h2>'
    + '<p class="lead">One real day off your plan. Every other day is already written too.</p>'
    + '<div class="pr-day">' + rows + '</div></div>';
}

function renderReveal() {
  const t = targets();
  main.innerHTML = '<span class="kicker">Built from your answers</span>' + revealHtml();
  nextBtn.style.display = '';
  setCta('Unlock my full plan', true);
  nextBtn.onclick = revealNext;
  /* The reveal used to close on "One payment. No subscription." Removed: this
     screen's job is to hand over the plan, and a price-shaped line under the
     button starts the money conversation a screen early. */
  legal.textContent = '';
  track('quiz_reveal', { kcal: t.kcal });
}

/* A4 collects the email AFTER the reveal instead of before the build, so the
   ask lands at peak investment rather than as the price of entry. Angles that
   still carry emailScreen() in their own array are unaffected and skip this. */
function revealNext() {
  if (A.email) return toPaywall();
  main.innerHTML = '';
  renderEmail({
    title: 'Where should your plan go?',
    body: 'We save it against this address so your week is waiting inside the app '
        + '\u2014 you will never fill this in twice.',
    cta: 'Save my plan',
  });
  document.getElementById('back').style.visibility = 'visible';
  document.getElementById('back').onclick = renderReveal;
  legal.textContent = '';
  nextBtn.onclick = function () {
    const v = (pending || '').toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
      const e = document.getElementById('eerr');
      e.hidden = false; e.textContent = 'That does not look like an email address.';
      return;
    }
    A.email = v; persist(true); backup({ email: v }); track('quiz_email', {});
    toPaywall();
  };
  track('quiz_email_shown', {});
}

function toPaywall() {
  const to = new URL('./paywall.html', location.href);
  if (ANGLE) to.searchParams.set('a', ANGLE);
  location.href = to.href;
}

render();
</script>
</body>
</html>
